name: build_upload

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Build-CI-CD-and-Notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3.13.0
        with:
          java-version: "17"
          distribution: corretto
      - uses: subosito/flutter-action@v2.10.0
        with:
          channel: 'stable'
      - name: Todays Date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Create .env file
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env
          echo "SEARCH_ENGINE_ID=${{ secrets.SEARCH_ENGINE_ID }}" >> .env

      - run: flutter pub get
      - run: dart run flutter_launcher_icons:main
      - run: dart run flutter_native_splash:create
      - run: flutter build apk
      - name: Upload to GDrive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GCREDS }}
          filename: "build/app/outputs/apk/release/app-release.apk"
          folderId: ${{ secrets.GFOLDERID }}
          name: randomizer_apk_${{ steps.date.outputs.date }}.apk
          overwrite: "true"
      - name: Send Slack Notif
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          # For posting a rich message using Block Kit
          payload: |
            {
              "text": "New GitHub Action build result: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "New GitHub Action build result: ${{ job.status }} https://drive.google.com/drive/folders/1IvNAdBNjLittuCnT7X-IzHjtAoGupsJE?usp=drive_link"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
  